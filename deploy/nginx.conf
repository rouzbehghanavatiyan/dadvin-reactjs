# Example only: adjust the domain and deployment path on the server.
server {
    listen 80;
    server_name _;
    root /var/www/dadvin/dist;
    index index.html;

    # Strip /backend/ and preserve the actual API path.
    location /backend/ {
        proxy_pass http://171.22.25.222:9090/;
        proxy_http_version 1.1;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Support refreshing /login and /register directly.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
