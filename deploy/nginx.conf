# Example only: adjust the domain and deployment path on the server.
server {
    listen 80;
    server_name _;
    root /var/www/dadvin/dist;
    index index.html;

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Support refreshing /login and /register directly.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
